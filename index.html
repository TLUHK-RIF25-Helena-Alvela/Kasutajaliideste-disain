<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tunniplaan – TLÜ Haapsalu kolledž</title>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-header__brand">
          <p class="site-header__org">TLÜ Haapsalu kolledž</p>
          <h1 class="site-header__title">Tunniplaan</h1>
        </div>

        <p class="site-header__date">
          <time class="site-header__day" data-field="day"></time>
          <span class="site-header__meta" data-field="day-meta"></span>
        </p>

        <p class="group-badge">
          <span class="visually-hidden">Rühm: </span>
          <span data-field="group"></span>
        </p>
      </div>
    </header>

    <main class="layout">
      <section class="next-lesson" aria-labelledby="next-lesson-label">
        <h2 class="next-lesson__label" id="next-lesson-label" data-field="label">Järgmine tund</h2>

        <div class="next-lesson__content" data-field="content">
          <p class="next-lesson__time">
            <time class="next-lesson__start" data-field="start"></time>
            <span class="next-lesson__end">kuni <time data-field="end"></time></span>
          </p>
          <p class="next-lesson__title" data-field="title"></p>

          <dl class="next-lesson__details">
            <div class="next-lesson__detail">
              <dt>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z" />
                  <circle cx="12" cy="9.5" r="2.5" />
                </svg>
                Ruum:
              </dt>
              <dd data-field="room"></dd>
            </div>
            <div class="next-lesson__detail">
              <dt>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 21a8 8 0 0 1 16 0" />
                </svg>
                <span class="visually-hidden">Õppejõud:</span>
              </dt>
              <dd data-field="teacher"></dd>
            </div>
          </dl>
        </div>

        <p class="next-lesson__empty" data-field="empty" hidden></p>
      </section>

      <section class="day-lessons" aria-labelledby="day-lessons-title">
        <h2 class="day-lessons__title" id="day-lessons-title">
          Päeva tunnid <span class="day-lessons__count" data-field="count"></span>
        </h2>
        <ol class="lesson-list" data-field="lesson-list"></ol>
      </section>
    </main>

    <footer class="site-footer">
      <p data-field="program"></p>
    </footer>

    <template id="lesson-template">
      <li class="lesson-list__item">
        <p class="lesson-break" data-field="break" hidden></p>
        <article class="lesson">
          <p class="lesson__time">
            <time class="lesson__start" data-field="start"></time>
            <span class="visually-hidden">kuni</span>
            <time class="lesson__end" data-field="end"></time>
          </p>
          <div class="lesson__body">
            <p class="lesson__status" data-field="status" hidden></p>
            <h3 class="lesson__title" data-field="title"></h3>
            <p class="lesson__meta">
              <span data-field="room"></span>
              <span aria-hidden="true">·</span>
              <span data-field="teacher"></span>
            </p>
          </div>
        </article>
      </li>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
